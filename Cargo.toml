[workspace]
resolver = "2"
members = ["crates/iam-contracts"]

[workspace.package]
edition = "2021"
rust-version = "1.90"

# Shared lint baseline. Individual crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
