# Full-repository strict analysis. Legacy debt is ratcheted rather than
# ignored: tools/quality/check_mypy_ratchet.py fails on any NEW error.
[mypy]
python_version = 3.12
strict = True
ignore_missing_imports = True
files = app

[mypy-app.*]
follow_imports = skip

# FastAPI-decorated route handlers use an untyped decorator in the pinned
# mypy/FastAPI combination; suppress only that diagnostic for this module.
[mypy-app.api.routes.ops]
disable_error_code = untyped-decorator
