# Strict type checking is introduced incrementally: it applies to new,
# self-contained modules first. Extend `files` as legacy modules are cleaned.
[mypy]
python_version = 3.12
strict = True
ignore_missing_imports = True
files =
    app/core/error_response.py,
    app/core/auth_policy.py,
    app/services/tool_authorization.py,
    app/api/routes/ops.py

[mypy-app.*]
follow_imports = skip
