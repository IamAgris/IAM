# Reverse proxy boundary for IAM's privileged endpoints.
#
# Edit the allow CIDRs below to the operator/email-gateway networks. Everything
# else is denied before reaching the backend. Public/user routes pass through.

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream iam_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Creator approval gateway: only the email/signer gateway may call it.
        location /api/v1/creator/gateway/decision {
            allow 127.0.0.1;
            allow ::1;
            # allow 10.0.0.0/8;   # add the gateway's network
            deny all;
            proxy_pass http://iam_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # First-credential bootstrap: operator network only.
        location /api/v1/auth/bootstrap {
            allow 127.0.0.1;
            allow ::1;
            # allow 10.0.0.0/8;   # add the operator network
            deny all;
            proxy_pass http://iam_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else (open user frontend traffic).
        location / {
            proxy_pass http://iam_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
