name: Supply chain checks

# Dependency vulnerability scanning, secret scanning and SBOM generation.
# These checks are additive: the existing ci.yml is left untouched.
on:
  push:
    branches: [main, testing]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit pinned backend dependencies
        run: python -m pip_audit --requirement backend/requirements.lock.txt

  npm-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [frontend, sdk/typescript, sdk/cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Audit dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository text for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v4
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: iam-sbom.spdx.json
