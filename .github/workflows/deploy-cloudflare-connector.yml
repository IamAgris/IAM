name: Deploy IAM Core Cloudflare connector

# Manual-only SSH deployment from a GitHub-hosted runner. No self-hosted runner.
# Required repository variables: DEPLOY_HOST, DEPLOY_USER, optional DEPLOY_PORT
# Required repository secrets: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS,
#                              CLOUDFLARE_TUNNEL_TOKEN (deploy only)
# See infra/cloudflare/GITHUB_DEPLOY.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy installs/starts the connector; verify only checks status'
        required: true
        type: choice
        default: verify
        options:
          - deploy
          - verify

permissions:
  contents: read

jobs:
  connector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy or verify the iam-core connector
        shell: bash
        run: bash infra/cloudflare/actions-deploy.sh "$ACTION"
