name: OpenAPI contract drift

# Detects when backend/app/api/routes changes without an approved update to
# IAM_OPENAPI.json. The snapshot is regenerated deliberately with:
#   python tools/api/print_openapi.py --update
on:
  push:
    branches: [main, testing]
    paths:
      - 'backend/app/**'
      - 'IAM_OPENAPI.json'
      - 'tools/api/**'
  pull_request:
    paths:
      - 'backend/app/**'
      - 'IAM_OPENAPI.json'
      - 'tools/api/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -e ./backend
      - name: Compare live app contract with snapshot
        run: python tools/api/print_openapi.py --check
      - name: Check migration numbering
        run: python tools/api/check_migrations.py
