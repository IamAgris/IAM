[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-sdk"
version = "0.1.0"
description = "Official Python SDK for the IAM Core"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
iam-creator = "iam_sdk.creator_cli:main"

[tool.setuptools]
packages = ["iam_sdk"]
